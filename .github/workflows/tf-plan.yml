name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/tf-*.yml"
      - ".github/actions/oci-auth/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.5"
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: Plan (dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
      OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
      OCI_TFSTATE_BUCKET: ${{ secrets.OCI_TFSTATE_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure OCI credentials
        uses: ./.github/actions/oci-auth
        with:
          user: ${{ secrets.OCI_CLI_USER }}
          tenancy: ${{ secrets.OCI_CLI_TENANCY }}
          fingerprint: ${{ secrets.OCI_CLI_FINGERPRINT }}
          region: ${{ secrets.OCI_CLI_REGION }}
          key: ${{ secrets.OCI_CLI_KEY_CONTENT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Configure remote state
        working-directory: .
        env:
          ENV: dev
        run: bash scripts/ci-backend.sh environments/dev

      - name: Terraform init
        run: terraform init -input=false -no-color -reconfigure

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: TFLint
        working-directory: .
        run: |
          tflint --init
          tflint --recursive

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli
          soft_fail: true

      - name: Terraform plan
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_CLI_TENANCY }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_admin_cidr: ${{ secrets.OCI_ADMIN_CIDR }}
          TF_VAR_ssh_public_key: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          TF_VAR_db_admin_password: ${{ secrets.DB_ADMIN_PASSWORD }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: |
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
          terraform show -no-color tfplan > plan-show.txt

      - name: Add plan to job summary
        if: always()
        working-directory: .
        run: |
          {
            echo "## Terraform plan — dev"
            echo '```hcl'
            tail -n 120 environments/dev/plan-show.txt 2>/dev/null || tail -n 120 environments/dev/plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'environments/dev/plan-show.txt';
            const plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'Plan output unavailable';
            const body = `## Terraform plan — dev\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan.slice(0, 60000)}\n\`\`\`\n\n</details>\n\nRun by @${context.actor}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
