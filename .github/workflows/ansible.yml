name: Ansible Configuration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansible-configuration
  cancel-in-progress: false

jobs:
  configure:
    name: Configure app tier (self-hosted ops runner)
    runs-on: [self-hosted, linux, x64, oci-platform]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible and collections
        run: |
          # Oracle Linux 9 ships Python 3.9; ansible-core 2.16+ needs 3.10+.
          sudo dnf -y install python3.11 python3.11-pip
          # Install system-wide (not --user) so the binary lands in /usr/local/bin
          # regardless of whether $HOME is set for the runner service account.
          sudo python3.11 -m pip install --upgrade "ansible-core>=2.16" docker oci-cli
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Install private key
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
        run: |
          # Use /tmp so this works even when $HOME is not set for the runner user
          mkdir -p /tmp/.runner-ssh
          chmod 700 /tmp/.runner-ssh
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > /tmp/.runner-ssh/oci_platform
          chmod 600 /tmp/.runner-ssh/oci_platform
          ssh-keygen -y -f /tmp/.runner-ssh/oci_platform > /dev/null

      - name: Build inventory from OCI tags
        env:
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_AUTH_MODE: instance_principal
        run: bash scripts/oci-inventory.sh ansible/inventory/hosts.ini

      - name: Run the playbook
        env:
          ADMIN_CIDR: ${{ secrets.OCI_ADMIN_CIDR }}
          OCIR_REGISTRY: iad.ocir.io
          OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
          OCIR_AUTH_TOKEN: ${{ secrets.OCIR_AUTH_TOKEN }}
          OCIR_IMAGE: ${{ secrets.OCIR_IMAGE }}
          # Redirect Ansible's temp dirs away from $HOME (ghrunner home may not exist)
          ANSIBLE_REMOTE_TMP: /tmp/.ansible-tmp
          ANSIBLE_LOCAL_TMP: /tmp/.ansible-tmp
        run: |
          export PATH="/usr/local/bin:$PATH"
          export ANSIBLE_PRIVATE_KEY_FILE="/tmp/.runner-ssh/oci_platform"
          mkdir -p /tmp/.ansible-tmp
          cd ansible
          ansible-playbook site.yml -i inventory/hosts.ini -v
