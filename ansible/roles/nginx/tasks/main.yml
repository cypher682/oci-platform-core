---
- name: Install nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: Remove the distribution default site
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent

- name: Deploy hardened nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Deploy platform reverse proxy
  ansible.builtin.template:
    src: platform.conf.j2
    dest: /etc/nginx/conf.d/platform.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Enable nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Allow HTTP through firewalld
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled
