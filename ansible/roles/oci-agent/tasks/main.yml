---
- name: Check for Oracle Cloud Agent
  ansible.builtin.stat:
    path: /usr/lib/oracle-cloud-agent
  register: oci_agent_path

- name: Enable the Oracle Cloud Agent
  ansible.builtin.systemd:
    name: "{{ oci_agent_service }}"
    enabled: true
    state: started
  when: oci_agent_path.stat.exists

- name: Install OCI CLI from Oracle Linux repos
  ansible.builtin.dnf:
    name: oci-cli
    state: present
  register: oci_cli_install
  failed_when: false
  changed_when: oci_cli_install.rc == 0

- name: Verify OCI CLI
  ansible.builtin.command: oci --version
  register: oci_cli_version
  changed_when: false
  failed_when: false

- name: Report OCI CLI status
  ansible.builtin.debug:
    msg: >-
      {{ 'OCI CLI ' + oci_cli_version.stdout if oci_cli_version.rc == 0
         else 'OCI CLI not installed from dnf — install it manually or use instance principals from a script' }}
