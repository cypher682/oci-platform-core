apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: platform
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/part-of: oci-platform-core
  annotations:
    oci.oraclecloud.com/load-balancer-type: "lb"
    oci.oraclecloud.com/load-balancer-shape: "flexible"
    oci.oraclecloud.com/load-balancer-shape-flex-min: "10"
    oci.oraclecloud.com/load-balancer-shape-flex-max: "10"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: platform-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  externalTrafficPolicy: Cluster
